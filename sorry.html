<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I'm Really Sorry 😢</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(135deg, #ffcccc, #fff0f0);
      font-family: Arial, sans-serif;
    }

    .message {
      background: white;
      padding: 45px;
      border-radius: 30px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.15);
    }

    .sad {
      font-size: 70px;
    }

    h1 {
      color: #e63946;
      font-size: 50px;
    }

    p {
      font-size: 23px;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="message">
    <div class="sad">😢🥺💔😭</div>

    <h1>I'm Really Sorry 💔</h1>

    <p>Please don't be angry with me... 🥺</p>
    <p>I really didn't mean to hurt you.💔</p>
    <p>I hope you can forgive me. 🙏😢</p>
    <p>You mean a lot to me. ❤️</p>
  </div>

</body>
</html>
