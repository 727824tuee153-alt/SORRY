<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I'm Sorry 💔</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffd6d6, #ffecec);
      font-family: Arial, sans-serif;
    }

    .sorry-box {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 {
      color: #e63946;
      font-size: 45px;
      margin-bottom: 15px;
    }

    p {
      font-size: 22px;
      color: #555;
    }

    .emoji {
      font-size: 55px;
      margin: 15px;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: #e63946;
      color: white;
      text-decoration: none;
      border-radius: 25px;
      font-size: 18px;
    }

    a:hover {
      background: #c92f3c;
    }
  </style>
</head>

<body>

  <div class="sorry-box">
    <div class="emoji">😢💔🥺</div>

    <h1>I'm Sorry 💔</h1>

    <!-- <p>I really didn't mean to hurt you.</p>
    <p>Please forgive me... 🥺🙏</p> -->

    <a href="sorry.html">Click here 💌</a>
  </div>

</body>
</html>
